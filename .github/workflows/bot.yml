name: Instagram автоответчик

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub иногда запускает с задержкой)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
    inputs:
      mode:
        description: "bot — обычная работа, test-ai — проверить нейросеть (ничего не отправляет)"
        type: choice
        options: [bot, test-ai]
        default: bot

concurrency:
  group: insta-bot
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ответить на комментарии и директ
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_ON: ${{ vars.AI_ON }}
        run: |
          if [ "${{ inputs.mode }}" = "test-ai" ]; then python test_ai.py; else python bot.py; fi
